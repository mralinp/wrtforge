name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: remote scripts are valid sh
        if: runner.os == 'Linux'
        run: for f in scripts/*.sh get.sh; do sh -n "$f"; done
      - name: release scripts
        if: runner.os == 'Linux'
        run: .github/scripts/test.sh

  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore

  version:
    name: next version
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          v=$(.github/scripts/next-version.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi
          echo "next version: $v"

  build:
    name: build ${{ matrix.target }}
    needs: version
    # on PRs this proves the release build still works; on main it feeds the release
    if: ${{ always() && (github.event_name == 'pull_request' || needs.version.outputs.release == 'true') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version || '0.0.0' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin, zig: false }
          - { os: macos-latest, target: x86_64-apple-darwin, zig: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, zig: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: zig toolchain for static linux builds
        if: matrix.zig
        uses: mlugg/setup-zig@v2
      - name: cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: stamp version
        run: sed -i.bak "s/^version = \"0.0.0\"/version = \"$VERSION\"/" Cargo.toml
      - name: build (zig)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: build
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset=wrtforge-${{ matrix.target }}.zip
            7z a "dist/$asset" "./target/${{ matrix.target }}/release/wrtforge.exe"
          else
            asset=wrtforge-${{ matrix.target }}.tar.gz
            tar -czf "dist/$asset" -C target/${{ matrix.target }}/release wrtforge
          fi
          cd dist && (sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset") > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: wrtforge-${{ matrix.target }}
          path: dist/*

  release:
    name: tag and publish release
    needs: [version, build]
    if: ${{ github.event_name == 'push' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: changelog
        run: .github/scripts/changelog.sh "${{ needs.version.outputs.version }}" "${{ github.repository }}" | tee notes.md
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" --title "v${{ needs.version.outputs.version }}" --notes-file notes.md
