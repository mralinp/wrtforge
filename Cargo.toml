[package]
name = "wrtforge"
# Placeholder: CI stamps the real version from git tags at build time (see CLAUDE.md).
version = "0.0.0"
edition = "2021"
description = "Forge a clean, official OpenWrt + Passwall2 (with a recovery slot) onto your router over SSH"
license = "MIT"
repository = "https://github.com/mralinp/wrtforge"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = { version = "0.11", default-features = false }
indicatif = "0.17"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
